<script type="text/javascript" charset="utf-8">
var TempValue = "FAHRENHEIT";var CityValue = localStorage.getItem("CityNames") || "";
function SetValue(val){CityValue=val;localStorage.setItem("CityNames",val);}
function SetCity(CityName) {CityValue=CityName;document.getElementById("myFrame").src = "https://www.meteoblue.com/en/weather/widget/three/" + CityName + "?geoloc=fixed&nocurrent=0&noforecast=0&days=7&tempunit=" + TempValue + "&windunit=KILOMETER_PER_HOUR&layout=dark";}
const toggleSwitch = document.querySelector('.theme-switch input[type="checkbox"]');
const currentTheme = localStorage.getItem('temp') || 'F';
if (currentTheme) {document.documentElement.setAttribute('data-theme', currentTheme);if (currentTheme === 'C') {toggleSwitch.checked = true;document.getElementById("txtLabel").innerText = "°C";document.getElementById("txtLabel").style.color = "#fff";TempValue = "CELSIUS";SetCity(CityValue);} else {toggleSwitch.checked = false;document.getElementById("txtLabel").innerText = "°F";document.getElementById("txtLabel").style.color = "#444";TempValue = "FAHRENHEIT";SetCity(CityValue);};}
function switchTheme(e) {if (e.target.checked) {document.getElementById("txtLabel").innerText = "°C";document.getElementById("txtLabel").style.color = "#fff";TempValue = "CELSIUS";localStorage.setItem('temp','C');SetCity(CityValue);} else {document.getElementById("txtLabel").innerText = "°F";document.getElementById("txtLabel").style.color = "#444";TempValue = "FAHRENHEIT";localStorage.setItem('temp','F');SetCity(CityValue);};}
var lcltheme = localStorage.getItem('temp');
if (lcltheme === 'C') {toggleSwitch.checked = true;document.getElementById("txtLabel").innerText = "°C";document.getElementById("txtLabel").style.color = "#fff";TempValue = "CELSIUS";SetCity(CityValue);} else {toggleSwitch.checked = false;document.getElementById("txtLabel").innerText = "°F";document.getElementById("txtLabel").style.color = "#444";TempValue = "FAHRENHEIT";SetCity(CityValue);}
toggleSwitch.addEventListener('change', switchTheme, false);
</script>
