<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modern Search</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

:root {
    --bg-light: #f5f5f7;
    --bg-dark: #0f0f10;
    --card-light: #ffffff;
    --card-dark: #1c1c1e;
    --text-light: #111;
    --text-dark: #f2f2f2;
    --glow-light: rgba(0, 122, 255, 0.4);
    --glow-dark: rgba(100, 210, 255, 0.6);
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    background: var(--bg-light);
    transition: background 0.4s ease;
}

body.dark {
    background: var(--bg-dark);
}

/* Top-right toggle */
.theme-toggle {
    position: fixed;
    top: 20px;
    right: 20px;
    font-size: 22px;
    background: none;
    border: none;
    cursor: pointer;
    transition: transform 0.3s ease, opacity 0.3s ease;
}

.theme-toggle:hover {
    transform: rotate(20deg) scale(1.2);
}

.search-wrapper {
    margin-top: 10vh;
    width: 100%;
    max-width: 1024px;
    padding: 20px;
    text-align: center;
    animation: fadeIn 1s ease;
}

.card {
    background: var(--card-light);
    padding: 50px 40px;
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.08);
    transition: all 0.4s ease;
}

body.dark .card {
    background: var(--card-dark);
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
}

h1 {
    margin-bottom: 35px;
    font-weight: 500;
    font-size: 28px;
    color: var(--text-light);
    letter-spacing: -0.5px;
}

body.dark h1 {
    color: var(--text-dark);
}

/* Clean minimal input styling */
input.gsc-input {
    outline: none !important;
    box-shadow: none !important;
    border: 1px solid transparent !important;
    border-radius: 8px !important;
    padding: 10px !important;
	font-size:18px;
    transition: border-color 0.2s ease !important;
}

/* Slightly darker border on focus (no glow) */
input.gsc-input:focus {
    outline: none !important;
    box-shadow: none !important;
    border: 1px solid transparent !important;
}

/* Dark mode version */
body.dark input.gsc-input {
    border: 1px solid #2c2c2e !important;
    background-color: #1c1c1e !important;
    color: #f2f2f2 !important;
}

body.dark input.gsc-input:focus {
    border: 1px solid #3a3a3c !important;
}

.gcse-searchresults {
    margin-top: 30px;
    text-align: left;
}

/* ===== Google CSE Full Theming ===== */

/* Search box container */
.gsc-control-cse {
    background: transparent !important;
    border: none !important;
    padding: 0 !important;
}

/* Input wrapper */
.gsc-input-box {
    border-radius: 10px !important;
    border: 1px solid #e5e5ea !important;
    background: #ffffff !important;
    transition: border 0.2s ease, background 0.2s ease !important;
}

/* Input field */
input.gsc-input {
    background: transparent !important;
    border: none !important;
    box-shadow: none !important;
    outline: none !important;
    padding: 10px !important;
    font-size: 18px !important;
}

/* Search button */
.gsc-search-button-v2 {
    background: #f2f2f7 !important;
    border-radius: 8px !important;
    border: none !important;
    transition: background 0.2s ease !important;
}

.gsc-search-button-v2:hover {
    background: #e5e5ea !important;
}

/* Focus state (clean, no glow) */
.gsc-input-box:focus-within {
    border: 1px solid #d1d1d6 !important;
}

/* ===== Dark Mode ===== */

body.dark .gsc-input-box {
    background: #1c1c1e !important;
    border: 1px solid #2c2c2e !important;
}

body.dark input.gsc-input {
    color: #f2f2f2 !important;
}

body.dark .gsc-search-button-v2 {
    background: #2c2c2e !important;
}

body.dark .gsc-search-button-v2:hover {
    background: #3a3a3c !important;
}

body.dark .gsc-input-box:focus-within {
    border: 1px solid #3a3a3c !important;
}




/* Responsive */
@media (max-width: 768px) {
    .card {
        padding: 35px 25px;
    }
}

@media (max-width: 480px) {
    .card {
        padding: 25px 15px;
    }
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
}
</style>
</head>

<body>

<button class="theme-toggle" id="themeIcon">🌙</button>

<div class="search-wrapper">
    <div class="card">
        <h1>Search The Web...</h1>

        <script async src="https://cse.google.com/cse.js?cx=016988569718590902801:wazfmxnk9fm"></script>
        <div class="gcse-searchbox"></div>
        <div class="gcse-searchresults"></div>
    </div>
</div>

<script>
const body = document.body;
const icon = document.getElementById("themeIcon");

/* Load saved theme */
if (localStorage.getItem("theme") === "dark") {
    body.classList.add("dark");
    icon.textContent = "☀️";
}

/* Toggle theme */
function toggleMode() {
    body.classList.toggle("dark");
    const isDark = body.classList.contains("dark");
    icon.textContent = isDark ? "☀️" : "🌙";
    localStorage.setItem("theme", isDark ? "dark" : "light");
	focusSearch();
}

icon.addEventListener("click", toggleMode);

/* Keyboard shortcuts */
document.addEventListener("keydown", (e) => {
   // if (e.key.toLowerCase() === "d") {
  //      toggleMode();
 //   }

    if (e.key === "/") {
        e.preventDefault();
        focusSearch();
    }
});

/* Focus search input */
function focusSearch() {
    const input = document.querySelector("input.gsc-input");
    if (input) input.focus();
}

/* Auto-focus on load */
window.addEventListener("load", () => {
    const interval = setInterval(() => {
        const input = document.querySelector("input.gsc-input");
        if (input) {
            input.focus();
            clearInterval(interval);
        }
    }, 300);
});

/* Smooth scroll to results */
document.addEventListener("click", function(e) {
    if (e.target.closest(".gsc-search-button")) {
        setTimeout(() => {
            document.querySelector(".gcse-searchresults")
                .scrollIntoView({ behavior: "smooth" });
        }, 500);
    }
});
</script>

</body>
</html>
